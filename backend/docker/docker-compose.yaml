services:
  postgres:
    container_name: anonforge_dev_postgres
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: anonforge
      POSTGRES_PASSWORD: anonforge
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: anonforge